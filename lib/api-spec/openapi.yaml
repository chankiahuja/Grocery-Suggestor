openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Grocery Suggester API with email OTP authentication and CSRF-protected sessions.
security:
  - SessionCookie: []
x-authentication-notes: >-
  API access requires a session except for health, auth, and feedback endpoints. Obtain a CSRF token
  from GET /auth/session and send it as X-CSRF-TOKEN on POST/PATCH/DELETE, including auth
  writes. Refresh the token after verification/logout. Production requires HTTPS and Secure cookies.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventory
    description: Household inventory management
  - name: suggestions
    description: Grocery purchase suggestions
  - name: shopping-lists
    description: Shopping list management
paths:
  /account/deletion-status:
    get:
      operationId: getAccountDeletionStatus
      tags: [account]
      summary: Check whether this session verified email within the last five minutes
      responses:
        "200":
          description: Server-side deletion eligibility
          content:
            application/json:
              schema:
                type: object
                required: [recentAuthentication]
                properties:
                  recentAuthentication:
                    type: boolean
        "401":
          description: Sign in required
  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      security:
        - SessionCookie: []
          CsrfToken: []
      summary: Permanently delete the current account from active application stores
      description: Requires email verification within five minutes. Deletes owned inventory, adjustment history, shopping data, email challenge and all account sessions in one transaction. Mailbox/provider backups require separate operator handling. A repeated request after revocation returns 401 or 403; a lost response must not be treated as confirmed success.
      responses:
        "204":
          description: Deletion committed and current session invalidated
        "401":
          description: Sign in required or account no longer exists
        "403":
          description: CSRF invalid or fresh email verification required
        "409":
          description: Data constraint prevented deletion; transaction rolled back
        "500":
          description: Unexpected failure. Database failures roll back; an error or lost response alone does not establish whether deletion committed. Recheck sign-in state before retrying.
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      security: []
      summary: Restore the session and obtain a CSRF token
      responses:
        "200":
          description: Current account or anonymous session; never cache this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/code:
    post:
      operationId: requestEmailCode
      tags: [auth]
      security:
        - CsrfToken: []
      summary: Request an expiring email code with request limits and resend cooldown
      description: Login requests enqueue delivery and return the same challenge shape whether an account exists or not. Only existing accounts receive login email. SMTP timing and failures do not affect the login response. Signup sends synchronously and may return a delivery error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeRequest"
      responses:
        "200":
          description: Login request accepted without confirming account existence or delivery; signup code delivered to the configured email transport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallenge"
        "400":
          description: Invalid email, intent or signup name
        "403":
          description: Missing or invalid CSRF token
        "429":
          description: Request limit or resend cooldown exceeded
        "503":
          description: Login delivery queue unavailable, or signup delivery failed; matching challenge invalidated
  /auth/verify:
    post:
      operationId: verifyEmailCode
      tags: [auth]
      security:
        - CsrfToken: []
      summary: Verify a code, create an account for signup or sign in an existing account for login, and rotate the session and CSRF token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerification"
      responses:
        "200":
          description: Authenticated session; session credential is an HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Generic verification failure; login also uses this response for expired codes, exhausted challenge attempts, and absent accounts
        "403":
          description: Missing or invalid CSRF token
        "410":
          description: Expired signup code; login failures remain generic
        "429":
          description: Attempt limit exceeded
  /auth/logout:
    post:
      operationId: logoutSession
      tags: [auth]
      security:
        - CsrfToken: []
      summary: Invalidate the server session and return a fresh anonymous CSRF token
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          description: Missing or invalid CSRF token
  /feedback/config:
    get:
      operationId: getFeedbackConfig
      tags: [feedback]
      security: []
      summary: Get the configured support address, if available
      responses:
        "200":
          description: Support contact configuration; null means no value is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackConfig"
  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      security:
        - CsrfToken: []
      summary: Send a categorized support or feedback message
      description: Validated messages are sent to the configured support mailbox. Contents are not persisted or logged. A success response means the SMTP transport accepted the message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSubmission"
      responses:
        "200":
          description: The configured mail transport accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackAccepted"
        "400":
          description: Invalid category, message, subject or reply email
        "403":
          description: Missing or invalid CSRF token
        "429":
          description: Submission rate limit exceeded
        "503":
          description: Support is not configured or the message could not be sent
  /notifications/stream:
    get:
      operationId: streamPantryNotifications
      tags: [notifications]
      summary: Server-sent cache invalidation signals after inventory changes and purchases
      description: Connect with EventSource. Event pantry-event contains a JSON type (inventory_changed, purchase_completed, alerts_changed, or heartbeat). Recover current alert state from GET /suggestions.
      responses:
        "200":
          description: Event stream; ready confirms connection
          content:
            text/event-stream:
              schema:
                type: string
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /inventory:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List all inventory items
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: lowStock
          in: query
          required: false
          description: Return only items with positive quantity at or below their minimum threshold.
          schema:
            type: boolean
        - name: outOfStock
          in: query
          required: false
          description: Return only items with zero quantity.
          schema:
            type: boolean
      responses:
        "200":
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Add a new inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/stats:
    get:
      operationId: getInventoryStats
      tags: [inventory]
      summary: Get inventory dashboard statistics
      responses:
        "200":
          description: Inventory stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryStats"

  /inventory/{id}:
    get:
      operationId: getInventoryItem
      tags: [inventory]
      summary: Get a single inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inventory/{id}/adjust:
    post:
      operationId: adjustInventoryItem
      tags: [inventory]
      summary: Consume or restock an inventory item atomically
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key for safely retrying the same adjustment request.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustmentInput"
      responses:
        "200":
          description: Adjusted inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid adjustment or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inventory/{id}/undo:
    post:
      operationId: undoInventoryAdjustment
      tags: [inventory]
      summary: Undo a consume or restock adjustment within five minutes
      description: >-
        Supply the original adjustment's Idempotency-Key as idempotencyKey in the body.
        The adjustment response remains an InventoryItem. Undo restores only quantity,
        and is allowed strictly before five minutes after the original adjustment if no
        later inventory write occurred (including edits, purchases, adjustments and ABA
        changes that return to the same quantity). Historical adjustments without revision
        metadata are ineligible. Successful retries return already_undone and current
        inventory, even after expiry or later edits, without writes or notifications.
        Retrying the original adjustment after undo never reapplies it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUndoInput"
      responses:
        "200":
          description: Undo applied or previously applied; includes current inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryUndoResult"
        "400":
          description: Missing, blank, non-string or oversized idempotencyKey; no writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item or adjustment key for this item not found; no writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Inventory changed or historical adjustment is ineligible; no writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Five-minute undo window expired; no writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /suggestions:
    get:
      operationId: getGrocerySuggestions
      tags: [suggestions]
      summary: Get grocery purchase suggestions based on inventory
      responses:
        "200":
          description: List of grocery suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrocerySuggestion"
  /suggestions/generate-list:
    post:
      operationId: generateShoppingListFromSuggestions
      tags: [suggestions]
      summary: Create a shopping list from current low-stock suggestions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingListGenerationInput"
      responses:
        "201":
          description: Shopping list generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListWithItems"
        "400":
          description: No low-stock suggestions are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shopping-lists:
    get:
      operationId: listShoppingLists
      tags: [shopping-lists]
      summary: List all shopping lists
      responses:
        "200":
          description: Shopping lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingList"
    post:
      operationId: createShoppingList
      tags: [shopping-lists]
      summary: Create a new shopping list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingListInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"

  /shopping-lists/{id}:
    get:
      operationId: getShoppingList
      tags: [shopping-lists]
      summary: Get shopping list with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Shopping list with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListWithItems"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteShoppingList
      tags: [shopping-lists]
      summary: Delete a shopping list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /shopping-lists/{id}/items:
    post:
      operationId: addShoppingListItem
      tags: [shopping-lists]
      summary: Add item to shopping list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingListItemInput"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"

  /shopping-lists/{id}/items/{itemId}:
    patch:
      operationId: updateShoppingListItem
      tags: [shopping-lists]
      summary: Update a shopping list item (e.g., mark as purchased)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: itemId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingListItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
    delete:
      operationId: deleteShoppingListItem
      tags: [shopping-lists]
      summary: Remove item from shopping list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: itemId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /shopping-lists/{id}/purchase:
    post:
      operationId: purchaseShoppingList
      tags: [shopping-lists]
      summary: Mark purchased items and restock inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Purchase applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResult"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: PANTRYPAL_SESSION
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
  schemas:
    FeedbackConfig:
      type: object
      required: [supportEmail, responseTime]
      properties:
        supportEmail:
          type: [string, "null"]
          format: email
        responseTime:
          type: [string, "null"]
          maxLength: 120
    FeedbackSubmission:
      type: object
      required: [category, message]
      properties:
        category:
          type: string
          enum: [problem, idea, other]
        subject:
          type: string
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 2000
        email:
          type: string
          format: email
          maxLength: 254
    FeedbackAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
    AuthAccount:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
    AuthSession:
      type: object
      required: [authenticated, account, csrfToken]
      properties:
        authenticated:
          type: boolean
        account:
          oneOf:
            - $ref: "#/components/schemas/AuthAccount"
            - type: "null"
        csrfToken:
          type: string
    EmailCodeRequest:
      type: object
      required: [email, intent]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        intent:
          type: string
          enum: [login, signup]
        name:
          type: string
          maxLength: 100
          description: Required for signup; never changes the name of an existing account
    EmailChallenge:
      type: object
      required: [challengeId, expiresAt, resendAt]
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
        resendAt:
          type: string
    EmailVerification:
      type: object
      required: [email, challengeId, code]
      properties:
        email:
          type: string
          format: email
        challengeId:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    InventoryUndoInput:
      type: object
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: Original adjustment's Idempotency-Key, scoped to the inventory item
      required: [idempotencyKey]

    InventoryUndoResult:
      type: object
      properties:
        status:
          type: string
          enum: [undone, already_undone]
        inventory:
          $ref: "#/components/schemas/InventoryItem"
      required: [status, inventory]

    InventoryAdjustmentInput:
      type: object
      properties:
        operation:
          type: string
          enum: [consume, restock]
        amount:
          type: number
          exclusiveMinimum: 0
      required:
        - operation
        - amount

    InventoryItem:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        category:
          type: string
        quantity:
          type: number
        unit:
          type: string
        minThreshold:
          type: number
        expiresAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - category
        - quantity
        - unit
        - minThreshold
        - expiresAt
        - notes
        - createdAt
        - updatedAt

    InventoryItemInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          minLength: 1
        minThreshold:
          type: number
          minimum: 0
        expiresAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required:
        - name
        - category
        - quantity
        - unit
        - minThreshold

    InventoryItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
        minThreshold:
          type: number
          minimum: 0
        expiresAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    InventoryStats:
      type: object
      properties:
        totalItems:
          type: number
        lowStockCount:
          type: number
        outOfStockCount:
          type: number
        expiringCount:
          type: number
        expiredCount:
          type: number
          description: Items with positive quantity and an expiry date before today in UTC.
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
      required:
        - totalItems
        - lowStockCount
        - outOfStockCount
        - expiringCount
        - expiredCount
        - categoryBreakdown

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: number
      required:
        - category
        - count

    GrocerySuggestion:
      type: object
      properties:
        inventoryItemId:
          type: ["number", "null"]
        name:
          type: string
        category:
          type: string
        currentQuantity:
          type: number
        minThreshold:
          type: number
        unit:
          type: string
        reason:
          type: string
        urgency:
          type: string
          enum: [critical, low, expiring_soon, expired]
          description: Expired alerts are independent of stock alerts; one item may have both expired and low entries. Zero-quantity items do not receive expired alerts. Expiry-only entries do not generate shopping purchases.
      required:
        - inventoryItemId
        - name
        - category
        - currentQuantity
        - minThreshold
        - unit
        - reason
        - urgency

    ShoppingList:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        itemCount:
          type: number
        purchasedCount:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - itemCount
        - purchasedCount
        - createdAt
        - updatedAt

    ShoppingListInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
        - name

    ShoppingListWithItems:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingListItem"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - items
        - createdAt
        - updatedAt

    ShoppingListItem:
      type: object
      properties:
        id:
          type: number
        shoppingListId:
          type: number
        inventoryItemId:
          type: ["number", "null"]
        name:
          type: string
        category:
          type: string
        quantity:
          type: number
        unit:
          type: string
        purchased:
          type: boolean
        notes:
          type: ["string", "null"]
      required:
        - id
        - shoppingListId
        - inventoryItemId
        - name
        - category
        - quantity
        - unit
        - purchased
        - notes

    ShoppingListItemInput:
      type: object
      properties:
        inventoryItemId:
          type: number
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          minLength: 1
        notes:
          type: string
      required:
        - name
        - category
        - quantity
        - unit

    ShoppingListItemUpdate:
      type: object
      properties:
        purchased:
          type: boolean
        quantity:
          type: number
          minimum: 0
        notes:
          type: string

    ShoppingListGenerationInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              inventoryItemId:
                type: number
              quantity:
                type: number
                minimum: 0
            required: [inventoryItemId, quantity]

    PurchaseResult:
      type: object
      properties:
        purchasedCount:
          type: number
        updatedInventoryItems:
          type: number
      required:
        - purchasedCount
        - updatedInventoryItems
