services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pantrypal
      POSTGRES_USER: ${DB_USER:-pantrypal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pantrypal}
    ports:
      - "5432:5432"
    volumes:
      - pantry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d pantrypal"]
      interval: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/pantrypal
      SPRING_PROFILES_ACTIVE: postgres
      DB_USER: ${DB_USER:-pantrypal}
      DB_PASSWORD: ${DB_PASSWORD:-pantrypal}
      MAIL_HOST: ${PANTRYPAL_SMTP_HOST:-mailpit}
      MAIL_PORT: ${PANTRYPAL_SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-PantryPal <no-reply@pantrypal.test>}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      # External SMTP with auth must also enable STARTTLS; Mailpit remains the local plaintext default.
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      PANTRYPAL_SUPPORT_EMAIL: ${PANTRYPAL_SUPPORT_EMAIL:-}
      PANTRYPAL_SUPPORT_RESPONSE_TIME: ${PANTRYPAL_SUPPORT_RESPONSE_TIME:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
volumes:
  pantry-data:
