<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantry Pal — A little more in order</title><link rel="icon" type="image/svg+xml" href="pantry-pal-icon.svg"><meta name="description" content="A calmer way to keep your pantry stocked. Interactive design concept."><style>
:root{--paper:#f7f6f1;--white:#fffefa;--ink:#292e26;--muted:#777b70;--line:#e4e5dc;--green:#46573c;--lime:#e5eacb;--orange:#b66739}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'Helvetica Neue',Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a8b885;outline-offset:3px}button{color:inherit}a{color:inherit;text-decoration:none}button{border:0;background:none}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:34px 20px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#f3f3eb}.brand{font-size:24px;letter-spacing:-1.2px;font-weight:650;display:flex;align-items:center;gap:10px;padding:0 9px}.mark{width:30px;height:32px;color:var(--green)}.caption{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}.side-label{margin:45px 13px 12px}nav{display:grid;gap:7px}.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;text-align:left;color:#72776a}.nav.active{background:#e3e7d7;color:#36492b;font-weight:600}.nav svg{width:19px;height:19px}.count{margin-left:auto;font-size:11px;border-radius:5px;background:#d3dbc4;padding:1px 7px}.side-bottom{margin-top:auto}.house{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fafaf5;display:flex;gap:10px;align-items:center}.avatar{width:33px;height:33px;border-radius:50%;background:#dfe5ce;display:grid;place-items:center;font-size:11px;font-weight:bold}.house small{display:block;color:var(--muted);font-size:11px}.sidebar-foot{font-size:11px;color:var(--muted);padding:16px 8px 0}main{min-width:0}.topbar{height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 42px;border-bottom:1px solid var(--line);gap:15px}.cr grid;place-items:center;background:#edf0e3;color:#6a7a50}.stat-icon svg{width:18px;height:18px}.columns{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:25px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px}.section-title h2{font-size:18px;font-weight:500;letter-spacing:-.5px;margin:0}.section-title button{font-size:11px;color:#687653}.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}.list-row{padding:16px 18px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #eeeee6}.list-row:last-child{border:0}.food-icon{width:43px;height:43px;border-radius:8px;display:grid;place-items:center;background:#f1f0e7;flex-shrink:0}.food-icon svg{width:29px;height:29px}.item-name{font-size:13px;font-weight:500}.item-meta{font-size:11px;color:var(--muted);margin-top:3px}.row-main{flex:1}.badge{padding:4px 7px;border-radius:5px;background:#f7eddc;color:#9b7136;font-size:10px;white-space:nowrap}.badge.expiry{color:#a16541;background:#f7eae1}.badge.good{background:#e9efde;color:#61754c}.plus{border:1px solid #e3e5db;width:29px;height:29px;border-radius:50%;font-size:19px;line-height:1}.plus:hover{background:var(--lime)}.basket-top{padding:18px 19px 14px;display:flex;justify-content:space-between}.basket-top strong{font-size:13px;font-weight:500}.basket-top small{font-size:11px;color:var(--muted);display:block}.check-row{display:flex;align-items:center;gap:10px;padding:10px 19px;font-size:12px}.check-row input{accent-color:var(--green);width:15px;height:15px}.check-row span{margin-left:auto;color:var(--muted);font-size:11px}.check-row:has(input:checked) label{text-decoration:line-through;color:var(--muted)}.basket-bottom{border-top:1px solid var(--line);padding:17px 19px;margin-top:12px}.basket-bottom .primary{width:100%}.note{font-size:10px;color:var(--muted);margin:9px 0 0;text-align:center}.bottom-note{padding:20px 0 0;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}.tiny-leaf{color:#8a9768}.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid var(--line);padding:7px 13px;border-radius:99px;font-size:12px}.chip.selected{background:var(--green);color:white;border-color:var(--green)}.search{width:100%;padding:12px 15px;background:var(--white);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}.inventory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.product{padding:20px;border:1px solid var(--line);background:var(--white);border-radius:10px}.product .food-icon{width:100%;height:110px;margin-bottom:16px;background:#f2f2e9}.product .food-icon svg{width:65px;height:65px}.product h3{font-size:15px;margin:8px 0 3px;font-weight:500}.product .badge{display:inline-block;margin:10px 0}.product-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.quantity{display:flex;gap:12px;align-items:center;font-size:12px}.quantity button{border:1px solid var(--line);border-radius:4px;width:25px;height:25px}.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:22px}.store{padding:23px 18px;border:1px solid var(--line);border-radius:10px;background:var(--white)}.store.best{border-color:#8c9c66;background:#f0f3e7}.store h3{margin:13px 0 20px;font-size:17px}.price{font-size:31px;letter-spacing:-1px;margin:8px 0}.store small{font-size:11px;color:var(--muted)}.callout{padding:15px 18px;background:#edeede;border-radius:8px;font-size:12px;color:#66724e;margin:20px 0}.empty{padding:45px 20px;text-align:center;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:28px;width:min(440px,92vw);color:var(--ink)}dialog::backdrop{background:#22291f66;backdrop-filter:blur(3px)}dialog h2{font-size:24px;letter-spacing:-.8px;font-weight:500;margin-top:0}dialog label{display:block;font-size:12px;margin:15px 0 5px}dialog input,dialog select{width:100%;border:1px solid var(--line);border-radius:6px;background:white;padding:10px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:9px;padding:12px 21px;z-index:10;font-size:13px;box-shadow:0 10px 35px #2223}.hidden{display:none!important}.view{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(min-width:1600px){.content{padding-top:45px}.hero{min-height:290px}}@media(max-width:1120px){.sidebar{padding-inline:12px}.shell{grid-template-columns:190px 1fr}.topbar{padding-inline:26px}.content{padding:25px 26px}.columns{grid-template-columns:1.25fr 1fr}.hero-text{padding:26px}.price-grid{grid-template-columns:repeat(2,1fr)}.inventory-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.shell{display:block}.sidebar{height:auto;position:static;padding:17px 20px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:22px;padding:0}.side-label,.side-bottom{display:none}nav{display:flex;gap:3px;margin-top:17px;overflow-x:auto}.nav{padding:9px 12px;white-space:nowrap;font-size:12px;gap:6px}.nav svg{width:16px}.count{display:none}.topbar{height:57px;padding-inline:20px}.content{padding:22px 20px}.columns{grid-template-columns:1fr}.heading h1{font-size:26px}.hero{min-height:225px}.hero h2{font-size:33px}.hero-text{max-width:330px;padding:25px}.hero:after{background:linear-gradient(90deg,#efebdeee,#efebdebb 48%,#efebde11)}.stats{gap:8px}.stat{padding:12px;align-items:flex-start}.stat-icon{display:none}.stat label{font-size:10px}.stat strong{font-size:25px}.stat small{font-size:9px}.location{font-size:11px}.top-right{gap:10px}.heading .primary{padding:10px 12px}.inventory-grid{gap:10px}.product{padding:15px}.bottom-note{gap:20px}.crumb{font-size:11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

<div class="shell"><aside class="sidebar"><a class="brand" href="#overview" aria-label="Pantry Pal home"><img class="brand-lockup" src="pantry-pal-logo.svg" alt="Pantry Pal" width="220" height="52"></a><div class="caption side-label">Your home, in sync</div><nav id="nav"></nav><div class="side-bottom"><div class="house"><div class="avatar">CA</div><div style="font-size:12px">Chanki’s home<small>Personal workspace</small></div></div><div class="sidebar-foot">Everyday essentials.<br>A little more peace of mind.</div></div></aside><main><header class="topbar"><div class="crumb">My workspace <span style="margin:0 12px;color:#b7b9ad">/</span><strong id="crumb">Overview</strong></div><div class="top-right"><span class="pill">DESIGN PREVIEW</span><span class="location">⌖ Gurugram</span><div class="avatar">CA</div></div></header><div class="content" id="app"></div></main></div>
<dialog id="addDialog"><form id="addForm"><h2>A new household essential.</h2><p style="color:var(--muted);font-size:12px">Keep the things you reach for close at hand.</p><label for="itemName">Item name</label><input id="itemName" required maxlength="70" placeholder="e.g. Laundry detergent"><label for="category">Category</label><select id="category"><option>Staples</option><option>Dairy</option><option>Produce</option><option>Cleaning</option><option>Personal care</option><option>Household</option></select><label for="amount">Quantity</label><input id="amount" type="number" min="1" max="100" value="1" required><div class="modal-actions"><button class="secondary" type="button" onclick="document.getElementById('addDialog').close()">Cancel</button><button class="primary" type="submit">Add to pantry +</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const icons={overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',pantry:'<path d="M4 5h16v16H4zM3 5l2-3h14l2 3M4 11h16M9 8h6M9 15h6"/>',shopping:'<path d="M3 3h2l3 13h11l2-9H6M10 21h.01M18 21h.01"/>',wishlist:'<path d="M20 5c-3-4-7-1-8 1-2-4-7-4-9 0-3 5 9 14 9 14S24 11 20 5Z"/>',compare:'<path d="M5 20V9M12 20V4M19 20V12M3 20h19"/>'};
const svg=(k)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+(icons[k]||icons.pantry)+'</svg>';
function food(k){let s={detergent:'<path d="M9 9h12l4 8v13H6V15Z" fill="#b6c1a3"/><rect x="10" y="3" width="10" height="7" rx="1" fill="#5c7050"/><rect x="10" y="17" width="11" height="9" rx="2" fill="#ecebdc"/><path d="M21 12q7 1 5 9" fill="none" stroke="#6b815a" stroke-width="2"/>',soap:'<rect x="7" y="12" width="18" height="19" rx="5" fill="#d4b88f"/><path d="M16 12V4h11M12 8h8" stroke="#63735a" stroke-width="3" fill="none"/><rect x="10" y="19" width="12" height="7" rx="2" fill="#f0e7d8"/>',tissue:'<path d="M5 8h22v22H5Z" fill="#e8e6db"/><ellipse cx="16" cy="8" rx="11" ry="5" fill="#fcfbf7" stroke="#bcbcaa"/><ellipse cx="16" cy="8" rx="4" ry="2" fill="#bcb69f"/><path d="M25 9v22h6V12" fill="#faf9f4" stroke="#d6d5c8"/>',milk:'<path d="M8 3h8v5l3 4v18H5V12l3-4Z" fill="#f8faf4" stroke="#8a9d8b"/><path d="M5 15h14v9H5" fill="#b7cabb"/><path d="M8 3h8v4H8" fill="#5f7a65"/>',rice:'<path d="M7 4h14l2 25H5Z" fill="#d9c5a3"/><path d="M7 7h14M5 26h18" stroke="#a38f6b"/><rect x="9" y="12" width="10" height="10" rx="5" fill="#f3e9cf"/><path d="m12 17 2-3 2 3-2 3Z" fill="#9f9b70"/>',tomato:'<circle cx="15" cy="19" r="11" fill="#c96c4d"/><path d="m15 11-6-2 5-1 1-5 2 5 5 1-5 2" fill="#5f7b47"/>',spinach:'<path d="M14 29C1 20 3 5 9 5c5-5 12 2 9 10 7-11 15-4 10 4-4 6-8 9-14 10Z" fill="#7b9363"/><path d="M13 31 16 12M15 24l8-7M15 20l-6-7" stroke="#4d6c3b" fill="none"/>',oats:'<rect x="6" y="6" width="19" height="24" rx="3" fill="#e3d9bf" stroke="#b1a083"/><rect x="5" y="3" width="21" height="5" rx="2" fill="#6f7d5c"/><rect x="9" y="13" width="13" height="10" rx="2" fill="#f4efdf"/><path d="M15 22V14m0 4-3-2m3 5 3-3" stroke="#b5a175"/>',lemon:'<path d="M5 20C1 8 20 2 27 9c8 10-9 25-19 17Z" fill="#dfc266"/><path d="M9 9c3-4 6-4 9-3" stroke="#f1df9d" stroke-width="2"/>'};return '<div class="food-icon"><svg aria-hidden="true" viewBox="0 0 32 34">'+(s[k]||s.oats)+'</svg></div>'}
const initial=[{id:10,name:'Laundry detergent',category:'Cleaning',qty:1,unit:'bottle',status:'low',icon:'detergent'},{id:11,name:'Hand wash',category:'Personal care',qty:2,unit:'bottles',status:'good',icon:'soap'},{id:12,name:'Toilet tissue',category:'Household',qty:3,unit:'rolls',status:'good',icon:'tissue'},{id:1,name:'Amul toned milk',category:'Dairy',qty:1,unit:'L',status:'low',icon:'milk'},{id:2,name:'Basmati rice',category:'Staples',qty:0.5,unit:'kg',status:'low',icon:'rice'},{id:3,name:'Fresh spinach',category:'Produce',qty:1,unit:'bunch',status:'expiry',icon:'spinach'},{id:4,name:'Tomatoes',category:'Produce',qty:6,unit:'pcs',status:'good',icon:'tomato'},{id:5,name:'Rolled oats',category:'Staples',qty:1,unit:'kg',status:'good',icon:'oats'},{id:6,name:'Lemons',category:'Produce',qty:4,unit:'pcs',status:'good',icon:'lemon'}];
let state;try{state=JSON.parse(localStorage.getItem('pantrypal-concept-v2'))}catch{};state=state||{items:initial,shopping:[{id:10,name:'Laundry detergent',qty:'1 bottle',checked:false},{id:1,name:'Amul toned milk',qty:'2 × 1 L',checked:false},{id:2,name:'Basmati rice',qty:'1 × 5 kg',checked:false},{id:7,name:'Whole wheat atta',qty:'1 × 5 kg',checked:false}],wishlist:[{id:8,name:'Extra virgin olive oil',qty:'500 ml',checked:false},{id:9,name:'Almond butter',qty:'250 g',checked:false}]};let view='overview',filter='All items',query='';const $=s=>document.querySelector(s);function save(){localStorage.setItem('pantrypal-concept-v2',JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.tid);window.tid=setTimeout(()=>$('#toast').classList.add('hidden'),2500)}const title={overview:'Overview',pantry:'Home inventory',shopping:'Shopping list',wishlist:'Wishlist',compare:'Compare prices'};
function nav(){ $('#nav').innerHTML=Object.keys(title).map(k=>`<a class="nav ${view===k?'active':''}" ${view===k?'aria-current="page"':''} href="#${k}">${svg(k)}${title[k]}${k==='shopping'?'<span class="count">'+state.shopping.length+'</span>':''}</a>`).join('');$('#crumb').textContent=title[view]}
function head(h,p,action=true){return `<div class="heading"><div><div class="caption">A LITTLE MORE IN ORDER</div><h1>${h}</h1><p>${p}</p></div>${action?'<button class="primary" onclick="openAdd()">+ <span>Add item</span></button>':''}</div>`}function badge(i){return `<span class="badge ${i.status==='expiry'?'expiry':i.status==='good'?'good':''}">${i.status==='low'?'Running low':i.status==='expiry'?'Use within 2 days':'In stock'}</span>`}function row(i){return `<div class="list-row">${food(i.icon)}<div class="row-main"><div class="item-name">${esc(i.name)}</div><div class="item-meta">${i.qty} ${i.unit} left · ${i.category}</div></div>${badge(i)}<button class="plus" onclick="addShopping(${i.id})" aria-label="Add ${esc(i.name)} to shopping list">${state.shopping.some(x=>x.id===i.id)?'✓':'+'}</button></div>`}function shopRows(arr,kind='shopping'){return arr.map(i=>`<div class="check-row"><input type="checkbox" aria-label="Mark ${esc(i.name)} as ${kind==='wishlist'?'wanted':'packed'}" ${i.checked?'checked':''} onchange="check(${i.id},'${kind}',this.checked)"><label>${esc(i.name)}</label><span>${esc(i.qty)}</span>${kind==='wishlist'?`<button class="plus" aria-label="Move ${esc(i.name)} to shopping list" onclick="moveWish(${i.id})">+</button>`:''}</div>`).join('')}
function render(){nav();let attention=state.items.filter(i=>i.status!=='good');let html='';if(view==='overview'){html=head('Make room for the everyday.','A calmer home starts with the little things.')+`<section class="hero"><img src="household.png" alt="Everyday household essentials, toiletries and pantry staples on a sunlit shelf"><div class="hero-text"><div class="caption">YOUR HOME. A LITTLE MORE TOGETHER.</div><h2>Life’s little essentials.<br>All in one place.</h2><p>From the laundry shelf to the breakfast cupboard. A little less keeping track, a little more living.</p><a class="text-link" href="#pantry">Step into your home <span style="margin-left:15px">↗</span></a></div></section><div class="stats"><div class="stat"><div><label>Household items</label><strong>${state.items.length.toString().padStart(2,'0')}</strong><small>Across your household</small></div><div class="stat-icon">${svg('pantry')}</div></div><div class="stat"><div><label>Running low</label><strong>${state.items.filter(i=>i.status==='low').length.toString().padStart(2,'0')}</strong><small>Ready for a top-up</small></div><div class="stat-icon">${svg('shopping')}</div></div><div class="stat"><div><label>Use soon</label><strong>${state.items.filter(i=>i.status==='expiry').length.toString().padStart(2,'0')}</strong><small>A little less food waste</small></div><div class="stat-icon">${svg('wishlist')}</div></div></div><div class="columns"><section><div class="section-title"><h2>A little attention needed</h2><a href="#pantry" style="font-size:11px;color:#687653">View pantry ↗</a></div><div class="panel">${attention.length?attention.map(row).join(''):'<div class="empty">All stocked up. You’re in good shape.</div>'}</div></section><section><div class="section-title"><h2>Your next shop</h2><a href="#shopping" style="font-size:11px;color:#687653">Open list ↗</a></div><div class="panel"><div class="basket-top"><div><strong>The essentials</strong><small>${state.shopping.length} items · shared with your household</small></div>${svg('shopping').replace('<svg','<svg style="width:20px;height:20px;color:#74855e"')}</div>${shopRows(state.shopping.slice(0,4))}<div class="basket-bottom"><a class="primary" href="#compare">Compare this list <span>↗</span></a><p class="note">Explore a comparison with sample prices</p></div></div></section></div>`}
if(view==='pantry'){html=head('Everything in its place.','A simple home for the things your household uses.')+`<input class="search" type="search" placeholder="Search household essentials…" aria-label="Search household essentials" value="${esc(query)}" oninput="query=this.value;renderProducts()"><div class="filterbar">${['All items','Staples','Dairy','Produce','Cleaning','Personal care','Household','Running low'].map(c=>`<button class="chip ${filter===c?'selected':''}" onclick="setFilter('${c}')">${c}</button>`).join('')}</div><div id="products" class="inventory-grid"></div>`}
if(view==='shopping'){html=head('A better next shop.','Your essentials, together in one easy list.',false)+`<div class="columns"><div class="panel"><div class="basket-top"><strong>The essentials</strong><small>${state.shopping.filter(i=>i.checked).length} of ${state.shopping.length} packed</small></div>${state.shopping.length?shopRows(state.shopping):'<div class="empty">Your list is clear. Add something from your pantry.</div>'}<div class="basket-bottom"><button class="secondary" onclick="addLow()">+ Add running-low items</button></div></div><div><div class="panel" style="padding:25px"><div class="caption">ONE LIST. A CLEARER CHOICE.</div><h2 style="font:28px Georgia,serif;font-weight:400">Where should you restock?</h2><p style="color:var(--muted);font-size:12px">See how a complete basket comparison could look before choosing where to shop.</p><a class="primary" href="#compare">Explore sample comparison ↗</a></div><p class="note">Prototype only · no ordering or payment</p></div></div>`}
if(view==='wishlist'){html=head('For a future shop.','A few things you’d like to try. Keep them here until you’re ready.',false)+`<div class="panel"><div class="basket-top"><strong>Nice to have</strong><small>Use + to move an item to your shopping list</small></div>${state.wishlist.length?shopRows(state.wishlist,'wishlist'):'<div class="empty">All your wishes made it to the shopping list.</div>'}</div>`}
if(view==='compare'){html=head('A little perspective on price.','A proposed comparison experience for your household.',false)+`<div class="callout"><strong>Illustrative prices only.</strong> These fixed sample quotes show the design for milk, rice and atta. They do not update with your shopping list and are not live retailer prices.</div><div class="section-title"><h2>Sample basket · 3 matched essentials</h2><span style="font-size:11px;color:var(--muted)">Gurugram · demo location</span></div><div class="price-grid">${[{name:'Blinkit',p:789},{name:'Zepto',p:762},{name:'Instamart',p:815},{name:'BigBasket',p:779}].map(s=>`<article class="store ${s.name==='Zepto'?'best':''}"><div class="caption">${s.name==='Zepto'?'LOWEST SAMPLE SUBTOTAL':'SAMPLE ITEM SUBTOTAL'}</div><h3>${s.name}</h3><div class="price">₹${s.p}</div><small>3 of 3 sample products matched</small><p style="font-size:11px;color:var(--muted);margin-top:22px">Delivery & handling: unverified<br>Member offers: excluded</p></article>`).join('')}</div><div class="panel" style="padding:22px;margin-top:23px"><h3 style="font-weight:500;margin:0 0 10px">Compare like with like.</h3><p style="font-size:12px;color:var(--muted);margin:0">Amul toned milk · 2 × 1 L &nbsp; / &nbsp; Basmati rice · 1 × 5 kg &nbsp; / &nbsp; Whole wheat atta · 1 × 5 kg</p><p style="font-size:12px;color:var(--muted)">The lowest item subtotal may not be the lowest checkout total. A connected version would need location-specific availability, exact product matches and applicable fees.</p><a href="#shopping" class="text-link">← Back to your shopping list</a></div>`}
$('#app').innerHTML='<div class="view">'+html+'<footer class="bottom-note"><span><span class="tiny-leaf">✧</span> Thoughtfully stocked. Simply lived.</span><span>Pantry Pal · Interactive concept · Sample data</span></footer></div>';if(view==='pantry')renderProducts()}
function renderProducts(){const arr=state.items.filter(i=>(filter==='All items'||filter==='Running low'&&i.status==='low'||i.category===filter)&&i.name.toLowerCase().includes(query.toLowerCase()));$('#products').innerHTML=arr.length?arr.map(i=>`<article class="product">${food(i.icon)}<div class="caption">${i.category}</div><h3>${esc(i.name)}</h3>${badge(i)}<div class="product-foot"><div class="quantity"><button onclick="quantity(${i.id},-1)" aria-label="Decrease ${esc(i.name)} quantity">−</button><span>${i.qty} ${i.unit}</span><button onclick="quantity(${i.id},1)" aria-label="Increase ${esc(i.name)} quantity">+</button></div><button class="plus" onclick="addShopping(${i.id})" aria-label="Add ${esc(i.name)} to shopping list">${state.shopping.some(x=>x.id===i.id)?'✓':'+'}</button></div></article>`).join(''):'<div class="empty">No items here yet.</div>'}function setFilter(f){filter=f;render()}function quantity(id,d){let i=state.items.find(x=>x.id===id);i.qty=Math.max(0,Math.round((i.qty+d)*10)/10);if(i.status!=='expiry')i.status=i.qty<=1?'low':'good';save();render()}function addShopping(id){let i=state.items.find(x=>x.id===id);if(state.shopping.some(x=>x.id===id))return notify('Already on your shopping list');state.shopping.push({id,name:i.name,qty:'1 × '+i.unit,checked:false});save();render();notify('Added to your shopping list')}function addLow(){state.items.filter(i=>i.status==='low').forEach(i=>{if(!state.shopping.some(x=>x.id===i.id))state.shopping.push({id:i.id,name:i.name,qty:'1 × '+i.unit,checked:false})});save();render();notify('Running-low items added')}function check(id,kind,val){state[kind].find(x=>x.id===id).checked=val;save();if(view==='shopping')render()}function moveWish(id){const i=state.wishlist.find(x=>x.id===id);if(!state.shopping.some(x=>x.id===id))state.shopping.push({...i,checked:false});state.wishlist=state.wishlist.filter(x=>x.id!==id);save();render();notify('Moved to your shopping list')}function openAdd(){$('#addDialog').showModal();$('#itemName').focus()}$('#addForm').onsubmit=e=>{e.preventDefault();const name=$('#itemName').value.trim();if(!name){$('#itemName').setCustomValidity('Enter an item name');$('#itemName').reportValidity();return}state.items.push({id:Date.now(),name,category:$('#category').value,qty:Number($('#amount').value),unit:'pcs',status:Number($('#amount').value)<=1?'low':'good',icon:'oats'});save();$('#addDialog').close();$('#addForm').reset();render();notify('Added to your pantry')};$('#itemName').oninput=()=>$('#itemName').setCustomValidity('');window.addEventListener('hashchange',()=>{view=title[location.hash.slice(1)]?location.hash.slice(1):'overview';render();window.scrollTo(0,0)});view=title[location.hash.slice(1)]?location.hash.slice(1):'overview';render();
</script></body></html>
