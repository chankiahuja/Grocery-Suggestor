server:
  port: ${API_PORT:8080}
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  profiles:
    default: local
    group:
      production: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pantrypal}
    username: ${DB_USER:pantrypal}
    password: ${DB_PASSWORD:pantrypal}
  jackson:
    time-zone: UTC
pantrypal:
  support:
    email: ${PANTRYPAL_SUPPORT_EMAIL:}
    response-time: ${PANTRYPAL_SUPPORT_RESPONSE_TIME:}
  auth:
    mail-from: ${MAIL_FROM:PantryPal <no-reply@pantrypal.test>}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    otp-secret: ${AUTH_OTP_SECRET:}
    otp-lifetime-seconds: ${AUTH_OTP_LIFETIME_SECONDS:300}
    resend-cooldown-seconds: ${AUTH_RESEND_COOLDOWN_SECONDS:30}
    max-attempts: ${AUTH_MAX_ATTEMPTS:5}
  expiry-check-ms: ${EXPIRY_CHECK_MS:60000}
