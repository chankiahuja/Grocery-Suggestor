server:
  port: ${API_PORT:8080}
spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pantrypal}
    username: ${DB_USER:pantrypal}
    password: ${DB_PASSWORD:pantrypal}
  jackson:
    time-zone: UTC
pantrypal:
  expiry-check-ms: ${EXPIRY_CHECK_MS:60000}
