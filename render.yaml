services:
  - type: web
    name: pantrypal-staging
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: pantrypal-staging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pantrypal-staging-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pantrypal-staging-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pantrypal-staging-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pantrypal-staging-db
          property: password
      - key: AUTH_OTP_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: PANTRYPAL_SMTP_REQUIRED
        value: "false"
      # Enter these through Render's protected environment settings for a staging delivery test.
      # The support address is intentionally not committed so the Blueprint remains reusable.
      - key: PANTRYPAL_SUPPORT_EMAIL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        sync: false
      - key: MAIL_STARTTLS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: pantrypal-staging-db
    databaseName: pantrypal
    user: pantrypal_staging
    plan: free
    region: oregon
    postgresMajorVersion: "17"
